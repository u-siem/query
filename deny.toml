# cargo-deny: https://embarkstudios.github.io/cargo-deny/
# Run with `cargo deny check`. CI runs it on every push and pull request.

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerable, unmaintained, unsound, yanked) fails.
unmaintained = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only, compatible with distributing this MIT crate.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/u-siem/usiem",
    "https://github.com/u-siem/evstore",
]
